<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>군중과 길찾기</title>
<link rel="icon" href="data:," />
<style>
  @font-face { font-family: 'Red Hat Mono'; font-weight: 500; font-display: swap; src: url('./fonts/red-hat-mono-latin-500-normal.woff2') format('woff2'); }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #a9a6c9; }
  #view { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; outline: none; cursor: crosshair; }
  #view.drag { cursor: grabbing; }
  .hud { position: fixed; pointer-events: none; font: 500 11px/1 'Red Hat Mono', ui-monospace, 'Cascadia Mono', Consolas, monospace;
    letter-spacing: 0.06em; text-transform: uppercase; color: #fafafa; }
  #label { top: 12px; left: 12px; display: flex; align-items: center; gap: 8px; padding: 8px 11px; border-radius: 7px;
    background: rgba(9, 9, 11, 0.62); border: 1px solid rgba(255, 255, 255, 0.08); }
  #label[hidden] { display: none; }
  #label .k { color: #a1a1aa; }
  /* Down the left, under the label: the page's fullscreen button sits in the top right corner, over the frame. */
  #tip { top: 48px; left: 12px; max-width: calc(100% - 72px); box-sizing: border-box; display: flex; flex-wrap: wrap; gap: 6px 18px; line-height: 1.2; padding: 8px 11px; border-radius: 7px; background: rgba(9, 9, 11, 0.62); border: 1px solid rgba(255, 255, 255, 0.08); }
  #credit { left: 12px; bottom: 10px; font-size: 10px; color: rgba(250, 250, 250, 0.72); text-transform: none; letter-spacing: 0.02em; text-shadow: 0 1px 2px rgba(0, 0, 0, 0.5); }
  @media (max-width: 720px) { #credit { display: none; } }
  /* 설정 패널: 단독 배포판에는 recipe.json의 컨트롤을 그려 줄 Patch 호스트가 없어 패널이 직접 제공한다. */
  #panel { position: fixed; top: 12px; right: 12px; display: flex; flex-direction: column; align-items: flex-end; gap: 8px;
    font: 500 11px/1.4 'Red Hat Mono', ui-monospace, 'Cascadia Mono', Consolas, monospace; letter-spacing: 0.04em; color: #fafafa; }
  #panel-toggle { cursor: pointer; padding: 8px 12px; border-radius: 7px; color: #fafafa; font: inherit; letter-spacing: inherit;
    background: rgba(9, 9, 11, 0.62); border: 1px solid rgba(255, 255, 255, 0.08); }
  #panel-toggle:hover { background: rgba(9, 9, 11, 0.78); }
  #panel-body { display: none; box-sizing: border-box; width: 252px; max-height: calc(100vh - 84px); overflow-y: auto;
    padding: 12px; border-radius: 7px; background: rgba(9, 9, 11, 0.62); border: 1px solid rgba(255, 255, 255, 0.08); }
  #panel.open #panel-body { display: block; }
  #panel .ctl { margin-bottom: 12px; }
  #panel .ctl:last-child { margin-bottom: 0; }
  #panel .ctl-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 6px; }
  #panel .ctl-head > span { min-width: 0; }
  #panel .ctl-value { color: #a1a1aa; }
  #panel .ctl-opts { display: flex; gap: 6px; }
  #panel .ctl-opts button { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 4px;
    cursor: pointer; color: #a1a1aa; font: inherit; background: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 6px; }
  #panel .ctl-opts button.on { color: #fafafa; border-color: rgba(255, 255, 255, 0.45); }
  #panel .ctl-opts img { width: 100%; border-radius: 4px; display: block; }
  #panel input[type='range'] { width: 100%; margin: 0; accent-color: #d4d4d8; }
  #panel input[type='checkbox'] { margin: 0; width: 14px; height: 14px; accent-color: #d4d4d8; }
  #panel .ctl-triggers { display: flex; gap: 6px; }
  #panel .ctl-triggers button { flex: 1; cursor: pointer; padding: 7px 4px; color: #fafafa; font: inherit;
    background: rgba(255, 255, 255, 0.08); border: 1px solid rgba(255, 255, 255, 0.12); border-radius: 6px; }
  #panel .ctl-triggers button:hover { background: rgba(255, 255, 255, 0.16); }
</style>
</head>
<body>
<canvas id="view"></canvas>
<div id="label" class="hud" hidden><span class="name"></span><span class="k"></span></div>
<div id="tip" class="hud"><span>왼쪽 클릭: 군중 보내기</span><span>오른쪽 클릭: 블록 놓기</span></div>
<div id="credit" class="hud">내비게이션: Mikko Mononen의 Recast &amp; Detour (zlib), Isaac Mason의 recast-navigation-js (MIT)</div>
<div id="panel"></div>
<script type="module" src="./src/demo.js"></script>
</body>
</html>
